    - data:
        code: "import random\nimport datetime\nimport string\nimport csv\nimport io\n\
          \ndef main(code_from_ai: str, target_count: int, full_ref_B=\"\", full_ref_R=\"\
          \"):\n    # 清洗程式碼\n    clean_code = code_from_ai.replace(\"```python\",\
          \ \"\").replace(\"```\", \"\").strip()\n    \n    # 取得大表變數\n    raw_ref\
          \ = full_ref_B if full_ref_B else full_ref_R\n    \n    # 字串轉型與清洗\n    if\
          \ isinstance(raw_ref, list):\n        final_ref_str = '\\n'.join([str(x)\
          \ for x in raw_ref])\n    else:\n        final_ref_str = str(raw_ref)\n\
          \        if final_ref_str.startswith(\"['\") and final_ref_str.endswith(\"\
          ']\"):\n            final_ref_str = final_ref_str[2:-2].replace(\"', '\"\
          , \"\\n\")\n            \n    final_ref_str = final_ref_str.replace('\\\\\
          n', '\\n').replace('\\\\r', '\\n')\n    \n    # 建立沙盒環境 \n    env = {\n \
          \       'random': random,\n        'datetime': datetime,\n        'string':\
          \ string,\n        'csv': csv,\n        'io': io,\n        'digits': string.digits,\
          \                \n        'ascii_uppercase': string.ascii_uppercase,\n\
          \        'ascii_letters': string.ascii_letters,\n        'target_count':\
          \ target_count,\n        'reference_csv_data': final_ref_str\n    }\n  \
          \  \n    try:\n        exec(clean_code, env)\n        \n        csv_str\
          \ = env.get('result', \"Error: AI 生成的程式碼中沒有 result 變數\")\n        \n   \
          \     return {\n            \"result\": csv_str\n        }\n    except Exception\
          \ as e:\n        debug_msg = f\"【程式邏輯崩潰】: {str(e)}\\n\\n--- AI 生成的代碼如下 ---\\\
          n{clean_code}\"\n        return {\n            \"result\": debug_msg\n \
          \       }"
